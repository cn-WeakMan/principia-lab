<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Principia Lab · 总知识点</title>
<style>
:root{color-scheme:dark;font:14px system-ui,-apple-system,'PingFang SC',sans-serif;background:#101923;color:#ebf2f9}*{box-sizing:border-box}body{margin:0}header{padding:15px 20px;background:#192836;border-bottom:1px solid #314353;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:20px;margin:0 16px 0 0}button,select,input{background:#21374a;border:1px solid #506477;color:#edf4f9;border-radius:8px;padding:9px;font:inherit}button{cursor:pointer}button:hover{background:#31536a}input[type=search]{min-width:180px;flex:1}header a{color:#9cd4db;text-decoration:none}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;height:calc(100vh - 78px)}main{overflow:auto;position:relative}#canvas{min-height:100%;min-width:100%;display:block}aside{padding:18px;border-left:1px solid #324559;overflow:auto;background:#152330}h2{font-size:17px;margin:0 0 12px}.muted{color:#aac0ce}.pill{display:inline-block;background:#29445a;padding:5px 9px;border-radius:6px;margin:3px}.detail{line-height:1.7;overflow-wrap:anywhere}#status{padding:6px 20px;background:#23384a;color:#c1d5e0}circle.node{cursor:pointer;stroke-width:2.5;transition:stroke-width .15s}circle.node:hover{stroke-width:4}text{pointer-events:none}.faint{opacity:.10}.linked{opacity:1}.col-label{font-size:15px;fill:#dbe9f4;font-weight:650}.node-label{font-size:11px;fill:#eef7ff}.edge{stroke:#7395a8;stroke-opacity:.23;stroke-width:1.4;fill:none;pointer-events:stroke}.edge.active{stroke:#ffd27c;stroke-opacity:.95;stroke-width:2.4}.scroll-note{font-size:12px}#empty{padding:45px;text-align:center;color:#b6cfdd}@media(max-width:800px){.layout{grid-template-columns:1fr;grid-template-rows:minmax(300px,65vh) 1fr;height:auto}aside{border-left:0;border-top:1px solid #324559}header{gap:7px}}
/* 10% 项目区 / 70% 知识图谱 / 20% 解释区（桌面和移动端均为垂直排列） */
html,body{height:100%;overflow:hidden}
body{display:grid;grid-template-rows:10vh 70vh 20vh;min-height:0}
header{min-height:0;height:100%;padding:6px 16px;gap:8px;align-content:center;overflow:auto}
header h1{font-size:clamp(15px,1.6vw,23px);white-space:nowrap}
header input,header select,header button{padding:6px 8px}
.layout{display:contents}
main{grid-row:2;min-height:0;overflow:auto;border-bottom:1px solid #324559;background:#101923}
aside{grid-row:3;min-height:0;display:flex;gap:12px;align-items:flex-start;padding:10px 16px;border:0;overflow:auto;background:#152330}
aside h2{min-width:95px;margin:3px 0;font-size:15px}
#detail{display:flex;gap:7px 17px;flex-wrap:wrap;align-items:center;line-height:1.4;min-width:0}
#detail p{margin:2px 0;max-width:560px}
#detail h3{font-size:13px;margin:4px 0}
#detail button{padding:4px 7px;margin:1px!important}
aside .scroll-note{display:none}
#status{position:absolute;top:10vh;right:12px;z-index:2;max-width:min(650px,80vw);border-radius:0 0 6px 6px;font-size:11px;padding:3px 10px;pointer-events:none;opacity:.9}
@media(max-width:800px){.layout{display:contents;height:auto;grid-template-columns:none;grid-template-rows:none}header{gap:5px}header input[type=search]{min-width:100px;flex:1}aside{border-top:0;padding:8px 12px;display:block}aside h2{margin:0 0 4px}#detail{gap:3px 9px}#detail p{font-size:12px}}
</style></head><body>
<header><h1>◈ Principia Lab · 总知识点</h1><select id="level"><option value="all">全部学段</option><option value="primary">小学</option><option value="junior">初中</option><option value="senior">高中</option></select><select id="subject"><option value="all">全部学科</option></select><input id="search" type="search" placeholder="搜索名称、节点 ID、公式"><button id="reload">读取数据库</button><input id="token" type="password" placeholder="管理员令牌（按需）" style="max-width:170px"><a href="/graph/all">原总图谱</a></header>
<div id="status">直接读取 SQLite 数据库中的最新草稿节点与关联；下方展示对应知识点的解释；本页面仅查看，不编辑。</div>
<div class="layout"><main id="viewport"><svg id="canvas" role="img" aria-label="按学科纵向排列的全部知识节点与关联图"></svg><div id="empty" hidden>没有匹配的节点</div></main><aside><h2>知识点解释</h2><div id="detail" class="detail muted">请选择上方图谱中的知识节点，查看该概念的定义、公式、适用范围与关联概念。</div><p class="muted scroll-note">学科纵向排列；同名学科按学段分列。可滚动查看完整节点，筛选不会改动数据库。不同学段的同名 ID 仍是不同节点。</p></aside></div>
<script>
const $=id=>document.getElementById(id), levels={primary:'小学',junior:'初中',senior:'高中'}, subjects={math:'数学',chinese:'语文',english:'英语',science:'科学',civics:'道德与法治',physics:'物理',chemistry:'化学',biology:'生物',geography:'地理',history:'历史',computer:'计算机',economics:'经济'};
const colors=['#39a6a3','#588fce','#cc9360','#9c78c9','#7cac66','#be7186','#769ac2','#a4a0d7','#d19c55','#5aa698'];let data={nodes:[],edges:[]},picked=null;
function el(tag,attrs={},text){let x=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let [k,v] of Object.entries(attrs))x.setAttribute(k,v);if(text!=null)x.textContent=text;return x}
function status(s){$('status').textContent=s}
async function load(){try{const headers={};const t=$('token').value||sessionStorage.getItem('plab-token');if(t){headers['X-Admin-Token']=t;sessionStorage.setItem('plab-token',t)}const endpoint=t?'/api/graph/all':'/api/graph/published';const r=await fetch(endpoint,{headers,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status+'，'+(t?'请检查管理员令牌':'请先在后台发布知识内容'));data=await r.json();const current=$('subject').value;const types=[...new Set(data.nodes.map(x=>x.subject))].sort();$('subject').replaceChildren(new Option('全部学科','all'),...types.map(x=>new Option(subjects[x]||x,x)));$('subject').value=types.includes(current)?current:'all';picked=new URLSearchParams(location.search).get('node');if(picked){const target=data.nodes.find(n=>n.key===picked);if(target){$('level').value='all';$('subject').value='all'}}draw();status((data.published?'已读取已发布知识图谱：':'已读取数据库草稿：')+data.nodes.length+' 个节点 / '+data.edges.length+' 条关联')}catch(e){status('读取失败：'+e.message)}}
function draw(){const sv=$('canvas');sv.replaceChildren();const q=$('search').value.trim().toLowerCase(), level=$('level').value, subject=$('subject').value;
const visible=data.nodes.filter(n=>(level==='all'||n.level===level)&&(subject==='all'||n.subject===subject)&&(!q||[n.name,n.id,n.formula].join(' ').toLowerCase().includes(q)));
$('empty').hidden=!!visible.length;const columns=[...new Set(visible.map(n=>n.level+'|'+n.subject))].sort((a,b)=>{let [al,as]=a.split('|'),[bl,bs]=b.split('|');return Object.keys(levels).indexOf(al)-Object.keys(levels).indexOf(bl)||as.localeCompare(bs)});
const byKey=new Map(visible.map(n=>[n.key,n]));const byColumn=new Map(columns.map(c=>[c,visible.filter(n=>n.level+'|'+n.subject===c).sort((a,b)=>a.sort_index-b.sort_index||a.id.localeCompare(b.id))]));
const stepX=188,stepY=66,padX=95,padY=98;let maxRows=Math.max(0,...[...byColumn.values()].map(a=>a.length));const width=Math.max(600,columns.length*stepX+90),height=Math.max(350,padY+maxRows*stepY+35);sv.setAttribute('width',width);sv.setAttribute('height',height);sv.setAttribute('viewBox',`0 0 ${width} ${height}`);
const points=new Map();columns.forEach((c,i)=>{let [l,s]=c.split('|'),x=padX+i*stepX;sv.append(el('text',{x,y:34,'text-anchor':'middle',class:'col-label'},(levels[l]||l)+' · '+(subjects[s]||s)));sv.append(el('line',{x1:x,x2:x,y1:49,y2:height-20,stroke:'#416076','stroke-opacity':'.45','stroke-dasharray':'3 6'}));byColumn.get(c).forEach((n,j)=>points.set(n.key,{x,y:padY+j*stepY,n,color:colors[i%colors.length]}))});
const edgeLayer=el('g'),nodeLayer=el('g');sv.append(edgeLayer,nodeLayer);for(const e of data.edges){const a=points.get(e.source),b=points.get(e.target);if(!a||!b)continue;const path=el('path',{d:`M${a.x},${a.y} C${(a.x+b.x)/2},${a.y} ${(a.x+b.x)/2},${b.y} ${b.x},${b.y}`,class:'edge','data-a':e.source,'data-b':e.target});edgeLayer.append(path)}
for(const {n,x,y,color} of points.values()){const g=el('g');const c=el('circle',{cx:x,cy:y,r:22,fill:color,stroke:'#172a38',class:'node',tabindex:'0',role:'button','aria-label':n.name+'，'+levels[n.level]+' '+(subjects[n.subject]||n.subject)});const label=el('text',{x,y:y+36,'text-anchor':'middle',class:'node-label'},n.name.length>12?n.name.slice(0,11)+'…':n.name);g.append(c,label);const show=()=>select(n.key,points);c.addEventListener('click',show);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}});nodeLayer.append(g)}
if(picked&&points.has(picked))select(picked,points);else $('detail').textContent='请选择知识图谱中的节点查看知识点解释。';}
function select(key,points){picked=key;const node=points.get(key)?.n;if(!node)return;const related=new Set([key]);let edges=[];for(const e of data.edges){if(e.source===key||e.target===key){const other=e.source===key?e.target:e.source;{if(points.has(other))related.add(other);edges.push({other,relation:e.relation})}}}
$('canvas').querySelectorAll('circle.node').forEach(c=>{const n=[...points.values()].find(p=>p.x===+c.getAttribute('cx')&&p.y===+c.getAttribute('cy'));c.classList.toggle('faint',!n||!related.has(n.n.key));c.setAttribute('stroke',n?.n.key===key?'#fff4b8':'#172a38')});$('canvas').querySelectorAll('.node-label').forEach(t=>t.classList.remove('faint'));
$('canvas').querySelectorAll('path.edge').forEach(p=>{const on=p.dataset.a===key||p.dataset.b===key;p.classList.toggle('active',on);p.classList.toggle('faint',!on)});
const d=$('detail');d.replaceChildren();function item(label,text){const p=document.createElement('p');const b=document.createElement('strong');b.textContent=label+'：';p.append(b,document.createTextNode(text||'—'));d.append(p)}item('名称',node.name);item('节点 ID',node.key);item('学科',levels[node.level]+' · '+(subjects[node.subject]||node.subject));item('公式',node.formula);item('知识点解释',node.description);if(node.limitation)item('适用范围',node.limitation);if(node.question)item('思考问题',node.question);const h=document.createElement('h3');h.textContent='关联概念（'+edges.length+'）';d.append(h);if(!edges.length)item('关联','当前筛选范围内无关联节点');for(const edge of edges){let other=points.get(edge.other)?.n||data.nodes.find(n=>n.key===edge.other);if(!other)continue;const btn=document.createElement('button');btn.style.margin='4px';btn.textContent=other.name+' · '+(levels[other.level]||other.level)+' ('+edge.relation+')';btn.onclick=()=>{if(points.has(other.key))select(other.key,points);else location.href=location.pathname+'?node='+encodeURIComponent(other.key)};d.append(btn)}}
$('level').onchange=draw;$('subject').onchange=draw;$('search').oninput=draw;$('reload').onclick=load;$('token').onchange=load;load();
</script></body></html>
